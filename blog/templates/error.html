{% extends 'base.html' %}
{% load static %}

{% block title %}{{error_message}}{% endblock %}

{% block content %}
<section>
    <div class="container">
        <div class="error-page">
            <h1 class="error-code">{{ error_code }}</h1>
            <h2 class="error-message">{{ error_message }}</h2>
            <p class="error-sub">What are you up to?</p>
            <a href="/" class="error-home-btn">Return to Homepage</a>
        </div>
    </div>
</section>
{% endblock %}
